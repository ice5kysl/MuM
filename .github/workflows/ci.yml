name: CI

# 手动触发。**没有** push / pull_request 触发器，原因如下：
#
# MuM 是 AppKit 应用，只能在 macOS runner 上构建，而 macOS runner 对
# **私有仓库是计费的**（Linux runner 的免费额度用不上）。
# 本仓库当前是私有的，自动触发会每次都失败在计费上，反而成了噪音。
#
# 仓库转公开后，macOS runner 有免费额度，取消下面两行的注释即可：
#
#   push:
#     branches: [main]
#   pull_request:
#
# 在打开之前，本地跑一遍等价的四步：
#   swift build && swift test && .build/debug/MuM --selftest && ./scripts/build-app.sh debug
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 构建
        run: swift build

      - name: 单元测试
        run: swift test

      - name: 渲染层自检（24 项断言）
        run: .build/debug/MuM --selftest

      - name: 应用内自驱动 UI 测试（6 场景，零权限）
        run: .build/debug/MuM --uitest all

      - name: 打包
        run: ./scripts/build-app.sh debug

      - name: 离屏快照（验证界面能完整渲染出来）
        run: |
          dist/MuM.app/Contents/MacOS/MuM --snapshot /tmp/mum.png
          test -s /tmp/mum.png

# 三点说明：
#
# 1. 这里**不用** .mumenv。它存在的理由是"受限沙箱里 ~/Library 不可写"，
#    那是本地开发环境的约束，GitHub runner 上不存在，反而会把 HOME 重定向掉。
#
# 2. --snapshot 不是凑数：它把整个窗口离屏渲染一遍，
#    任何视图层级的崩溃（约束冲突、越界、绘制异常）都会让这一步失败。
#
# 3. --uitest 是应用内自驱动 UI 测试：让应用程序化触发自己的动作再断言状态，
#    覆盖设置面板 / popover / 模式切换 / 查找 / 大纲 / 全局搜索。
#    零权限（不需要 Accessibility），屏外窗口运行，适合 CI。
#    仍有的盲区：颜色/间距/字形这类"长得对不对"—— 那是人工手册的范围。
